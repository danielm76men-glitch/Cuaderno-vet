<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VetDiario · Medicina Veterinaria</title>
<link rel="icon" href="icon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" id="themeColorMeta" content="#f3f1e7" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de arranque. Es la unica visible al cargar: hasta que
       onAuthStateChanged responda por primera vez no se sabe si hay sesion
       guardada, y mostrar el login mientras tanto hacia parecer que la
       sesion se habia perdido. -->
  <div class="boot-gate" id="bootGate">
    <img class="brand-mark brand-mark-lg" src="icon.svg" alt="" width="44" height="44" />
    <p id="bootMsg">Cargando…</p>
  </div>

  <div class="auth-gate" id="authGate" hidden>
    <div class="auth-card">
      <h1><img class="brand-mark brand-mark-lg" src="icon.svg" alt="" width="44" height="44" /> VetDiario</h1>
      <p>Medicina Veterinaria</p>
      <label for="authEmail">Tu correo</label>
      <input type="email" id="authEmail" placeholder="tu@correo.com" autocomplete="email" inputmode="email" />
      <button id="authSendBtn" type="button">Enviar enlace de acceso</button>
      <p class="auth-msg" id="authMsg"></p>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-brand"><img class="brand-mark" src="icon.svg" alt="" width="26" height="26" /> VetDiario</div>
      <nav class="sidebar-nav" id="pageNav">
        <button class="nav-item" data-page="dashboard" type="button"><span class="ico">🏠</span> Inicio</button>
        <button class="nav-item" data-page="patients" type="button"><span class="ico">🐶</span> Pacientes <span class="count" id="countPatients">0</span></button>
        <button class="nav-item" data-page="farmacos" type="button"><span class="ico">💊</span> Fármacos <span class="count" id="countFarmacos">0</span></button>
        <button class="nav-item" data-page="study" type="button"><span class="ico">📚</span> Estudio <span class="count" id="countStudy">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-page="settings" type="button"><span class="ico">⚙️</span> Configuración</button>
        <div class="sidebar-identity" id="sidebarIdentity" hidden>
          <span class="sid-name" id="sidName"></span>
          <span class="sid-title" id="sidTitle"></span>
        </div>
        <p class="sidebar-user" id="authUser" hidden></p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="toggleSidebar" type="button" aria-label="Abrir menú">☰</button>
        <div class="topbar-search">
          <input type="search" id="search" placeholder="Buscar en VetDiario…" autocomplete="off" />
        </div>
        <div class="topbar-right">
          <div class="conn-pill" id="connPill">
            <span class="dot"></span>
            <span id="connText">Conectando…</span>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar a modo oscuro">🌙</button>
          <button class="sign-out-btn" id="signOutBtn" type="button">Salir</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
