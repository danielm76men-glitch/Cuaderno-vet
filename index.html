<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VetDiario · Medicina Veterinaria</title>
<link rel="icon" href="icon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" id="themeColorMeta" content="#f3f1e7" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de arranque. Es la unica visible al cargar: hasta que
       onAuthStateChanged responda por primera vez no se sabe si hay sesion
       guardada, y mostrar el login mientras tanto hacia parecer que la
       sesion se habia perdido. -->
  <div class="boot-gate" id="bootGate">
    <img class="brand-mark brand-mark-lg" src="icon.svg" alt="" width="44" height="44" />
    <p id="bootMsg">Cargando…</p>
    <div class="boot-rescate" id="bootRescate" hidden>
      <p>Esto tarda más de lo normal. Suele ser una versión antigua guardada en el navegador.</p>
      <button type="button" id="bootRescateBtn">Recargar limpiando la caché</button>
      <p class="boot-rescate-nota">No se pierden tus datos ni la sesión.</p>
    </div>
  </div>

  <!-- Vigilante de arranque.

       Va aquí como script normal y NO dentro de app.js a propósito: si
       app.js no llega a cargarse o falla al interpretarse, nada de lo que
       haya dentro se ejecuta y la pantalla se queda en "Cargando…" para
       siempre, sin forma de salir. Este script sí corre pase lo que pase.

       El caso típico es una actualización a medias: GitHub Pages sirve los
       archivos con max-age=600, así que durante diez minutos el navegador
       puede mezclar un index.html nuevo con un app.js viejo. El botón borra
       el service worker y las cachés — pero NO IndexedDB, que es donde
       viven la sesión y los datos sin conexión. -->
  <script>
    (function () {
      var SEGUNDOS = 8;
      setTimeout(function () {
        if (window.__vetdiarioArrancado) return;
        var caja = document.getElementById("bootRescate");
        if (caja) caja.hidden = false;
      }, SEGUNDOS * 1000);

      var btn = document.getElementById("bootRescateBtn");
      if (!btn) return;
      btn.addEventListener("click", function () {
        btn.disabled = true;
        btn.textContent = "Limpiando…";
        var tareas = [];
        try {
          if (navigator.serviceWorker) {
            tareas.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if (window.caches) {
            tareas.push(
              caches.keys().then(function (nombres) {
                return Promise.all(nombres.map(function (n) { return caches.delete(n); }));
              })
            );
          }
        } catch (e) { /* si algo no está disponible, se recarga igual */ }

        Promise.all(tareas)["catch"](function () {})["then"](function () {
          // El parámetro obliga a pedir el HTML de nuevo en vez de tomarlo
          // de la caché del navegador, que es lo que causó el problema.
          location.replace(location.pathname + "?nuevo=" + Date.now());
        });
      });
    })();
  </script>

  <div class="auth-gate" id="authGate" hidden>
    <div class="auth-card">
      <h1><img class="brand-mark brand-mark-lg" src="icon.svg" alt="" width="44" height="44" /> VetDiario</h1>
      <p>Medicina Veterinaria</p>
      <label for="authEmail">Tu correo</label>
      <input type="email" id="authEmail" placeholder="tu@correo.com" autocomplete="email" inputmode="email" />
      <button id="authSendBtn" type="button">Enviar enlace de acceso</button>
      <p class="auth-msg" id="authMsg"></p>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-brand"><img class="brand-mark" src="icon.svg" alt="" width="26" height="26" /> VetDiario</div>
      <nav class="sidebar-nav" id="pageNav">
        <button class="nav-item" data-page="dashboard" type="button"><span class="ico">🏠</span> Inicio</button>
        <button class="nav-item" data-page="patients" type="button"><span class="ico">🐶</span> Pacientes <span class="count" id="countPatients">0</span></button>
        <button class="nav-item" data-page="farmacos" type="button"><span class="ico">💊</span> Fármacos <span class="count" id="countFarmacos">0</span></button>
        <button class="nav-item" data-page="study" type="button"><span class="ico">📚</span> Estudio <span class="count" id="countStudy">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-page="settings" type="button"><span class="ico">⚙️</span> Configuración</button>
        <div class="sidebar-identity" id="sidebarIdentity" hidden>
          <span class="sid-name" id="sidName"></span>
          <span class="sid-title" id="sidTitle"></span>
        </div>
        <p class="sidebar-user" id="authUser" hidden></p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="toggleSidebar" type="button" aria-label="Abrir menú">☰</button>
        <div class="topbar-search">
          <input type="search" id="search" placeholder="Buscar en VetDiario…" autocomplete="off" />
        </div>
        <div class="topbar-right">
          <div class="conn-pill" id="connPill">
            <span class="dot"></span>
            <span id="connText">Conectando…</span>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar a modo oscuro">🌙</button>
          <button class="sign-out-btn" id="signOutBtn" type="button">Salir</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
