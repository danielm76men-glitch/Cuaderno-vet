<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cuaderno · Medicina Veterinaria</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📓</text></svg>" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#f3f1e7" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth-gate" id="authGate">
    <div class="auth-card">
      <h1>🐾 Cuaderno-vet</h1>
      <p>Medicina Veterinaria</p>
      <label for="authEmail">Tu correo</label>
      <input type="email" id="authEmail" placeholder="tu@correo.com" autocomplete="email" inputmode="email" />
      <button id="authSendBtn" type="button">Enviar enlace de acceso</button>
      <p class="auth-msg" id="authMsg"></p>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-brand"><span class="glyph">🐾</span> Cuaderno-vet</div>
      <nav class="sidebar-nav" id="pageNav">
        <button class="nav-item" data-page="dashboard" type="button"><span class="ico">🏠</span> Inicio</button>
        <button class="nav-item" data-page="patients" type="button"><span class="ico">🐶</span> Pacientes <span class="count" id="countPatients">0</span></button>
        <button class="nav-item" data-page="farmacos" type="button"><span class="ico">💊</span> Fármacos <span class="count" id="countFarmacos">0</span></button>
        <button class="nav-item" data-page="study" type="button"><span class="ico">📚</span> Estudio <span class="count" id="countStudy">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <button class="nav-item" data-page="settings" type="button"><span class="ico">⚙️</span> Configuración</button>
        <p class="sidebar-user" id="authUser" hidden></p>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="toggleSidebar" type="button" aria-label="Abrir menú">☰</button>
        <div class="topbar-search">
          <input type="search" id="search" placeholder="Buscar en el cuaderno…" autocomplete="off" />
        </div>
        <div class="topbar-right">
          <div class="conn-pill" id="connPill">
            <span class="dot"></span>
            <span id="connText">Conectando…</span>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" title="Cambiar tema" aria-label="Cambiar a modo oscuro">🌙</button>
          <button class="sign-out-btn" id="signOutBtn" type="button">Salir</button>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
